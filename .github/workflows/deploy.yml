name: Deploy Memories Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and Deploy Memories Hub

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify frontend
        run: |
          echo "Checking frontend..."
          test -f frontend/index.html
          test -f frontend/css/style.css
          test -f frontend/js/app.js
          echo "Frontend files found:"
          find frontend -maxdepth 2 -type f

      - name: Prepare website
        run: |
          mkdir -p _site
          cp -r frontend/. _site/
          echo "Website files:"
          find _site -maxdepth 2 -type f

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
